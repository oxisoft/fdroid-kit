name: fdroidkit publish
description: Publish the Play-signed universal APK of a release to your own F-Droid repo.
# GitHub Actions composite action:
#
#   - uses: oxisoft/fdroid-kit/.github/actions/publish@v0.1.0
#     with: { package: com.example.app, version-code: "42", version-name: "1.4.0" }
#
# Status: skeleton (v0.0.1). The `publish` command lands in v0.1; the hosted-runner
# key handling (FDROID_KEYSTORE_B64 to $RUNNER_TEMP, wiped afterwards) with it.
inputs:
  package:
    description: Application id
    required: true
  version-code:
    description: versionCode of the release
    required: true
  version-name:
    description: versionName of the release
    required: true
  repo-path:
    description: Path of the F-Droid repo working tree
    default: fdroid
  source:
    description: play | file | github-release
    default: play
  dry-run:
    description: "true = run every check, publish nothing"
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install fdroidkit
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}/../../..[play]"
    - name: Publish
      shell: bash
      run: |
        umask 022
        args=()
        [ "${{ inputs.dry-run }}" = "true" ] && args+=(--dry-run)
        python -m fdroidkit --repo "${{ inputs.repo-path }}" publish \
          "${{ inputs.package }}" "${{ inputs.version-code }}" "${{ inputs.version-name }}" \
          --source "${{ inputs.source }}" "${args[@]}"
