# Test gate on every push to the source repo (Gitea, runner `hermes`).
name: test

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: hermes
    timeout-minutes: 10
    steps:
      - name: Checkout pushed commit
        env:
          CI_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          rm -rf src
          git clone --quiet --depth 50 --branch "${GITHUB_REF_NAME}" "https://ci:${CI_TOKEN}@g.oxisoft.io/${GITHUB_REPOSITORY}.git" src
          git -C src checkout --quiet "${GITHUB_SHA}" || echo "commit not in the last 50, testing branch head"
          git -C src log --oneline -1

      - name: Tests
        working-directory: src
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -e '.[dev]'
          .venv/bin/fdroidkit --version
          .venv/bin/pytest -q

      - name: Clean up
        if: always()
        run: rm -rf src
