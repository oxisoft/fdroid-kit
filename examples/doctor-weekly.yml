# Weekly health check of your live F-Droid repo (GitHub Actions). Copy to
# .github/workflows/doctor.yml in any repo; a failed check turns the run red and GitHub
# mails the workflow owner. Gitea / Forgejo: same file under .gitea/workflows/, your
# runner label, and `uses: https://github.com/oxisoft/fdroid-kit/actions/doctor@v0.1.9`.
name: fdroid doctor

on:
  schedule:
    - cron: "17 6 * * 1"   # Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      # Only needed for repo-path (pin + version checks against your metadata/).
      - uses: actions/checkout@v7
      - uses: oxisoft/fdroid-kit/.github/actions/doctor@v0.1.9
        with:
          url: https://fdroid.example.com/fdroid/repo
          repo-path: fdroid          # optional: your F-Droid working tree in this repo
          budget: github-pages       # optional: warn at 80%, fail at 100% of the 1 GB Pages limit
          fail-on-warn: "false"      # "true" = warnings fail the run too
