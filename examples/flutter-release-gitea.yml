# Release job of a Flutter app on Gitea / Forgejo: Play internal upload, then F-Droid.
# Runs on a self-hosted runner that holds the F-Droid repo working tree and its index key.
name: android-release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: Build and upload to Play internal
        run: |
          flutter build appbundle --release
          # your Play upload step here (fastlane, a script, ...)
      - name: Version from the tag (vX.Y.Z+N)
        id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          echo "name=${tag%+*}" >> "$GITHUB_OUTPUT"
          echo "code=${tag#*+}" >> "$GITHUB_OUTPUT"
      - name: Publish to F-Droid
        # Secrets only as env: the Play service account (written to a 0600 temp file and
        # removed) and the index key passphrases config.yml reads with {env: NAME}.
        uses: https://github.com/oxisoft/fdroid-kit/actions/gitea@v0.1.5
        env:
          PLAY_SA_JSON: ${{ secrets.PLAY_SA_JSON }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASS }}
        with:
          package: com.example.app
          version-code: ${{ steps.v.outputs.code }}
          version-name: ${{ steps.v.outputs.name }}
          repo-path: /srv/fdroid
          # optional: rebuild the landing page, then copy it next to the repo
          after-update: fdroidkit site
          rsync-site: www@web:/var/www/fdroid.example.com/
