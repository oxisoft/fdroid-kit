# Static F-Droid repo + landing page. Replace fdroid.example.com and the paths.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fdroid.example.com;

    root /var/www/fdroid.example.com;   # landing page; repo under /fdroid/repo
    index index.html;

    location /fdroid/ {
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;

        # Clients must see a new index at once.
        location ~ ^/fdroid/(repo|archive)/(index|entry)[^/]*$ {
            add_header Cache-Control "no-cache";
        }
        location ~ \.apk$ {
            add_header Content-Disposition "attachment";
        }
    }
}
